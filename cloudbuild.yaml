steps:
  # Install dependencies
  - name: "node:22"
    entrypoint: "npm"
    args: ["install"]

  # Build the project
  - name: "node:22"
    entrypoint: "npm"
    args: ["run", "build"]

  # Deploy to Firebase Hosting (settings in firebase.json)
  - name: "node:22"
    entrypoint: "npx"
    args:
      [
        "--yes",
        "firebase-tools@13",
        "deploy",
        "--only",
        "hosting",
        "--project",
        "$PROJECT_ID",
        "--non-interactive",
      ]

  # Tell IndexNow engines (Bing and others) to recrawl the deployed pages.
  # A failed ping should not mark the deploy as failed.
  - name: "node:22"
    entrypoint: "node"
    args: ["scripts/indexnow.mjs"]
    allowFailure: true

options:
  logging: CLOUD_LOGGING_ONLY
