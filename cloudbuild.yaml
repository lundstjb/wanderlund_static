steps:
  # Install dependencies
  - name: "node:18"
    entrypoint: "npm"
    args: ["install"]

  # Build the project
  - name: "node:18"
    entrypoint: "npm"
    args: ["run", "build"]

  # Deploy to Firebase Hosting (settings in firebase.json)
  - name: "node:18"
    entrypoint: "npx"
    args:
      [
        "--yes",
        "firebase-tools@13",
        "deploy",
        "--only",
        "hosting",
        "--project",
        "$PROJECT_ID",
        "--non-interactive",
      ]

options:
  logging: CLOUD_LOGGING_ONLY
